name: 部署看板到 GitHub Pages

# 触发时机:
#   1. push 到 main(改代码后自动重新部署)
#   2. 每周一 06:17 UTC 自动刷新数据并部署
#   3. 在 GitHub 仓库 Actions 页面手动 Run workflow
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # 提交刷新后的数据文件
  pages: write      # 部署到 GitHub Pages
  id-token: write   # Pages 部署所需

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 抓取最新会议数据
        run: python scripts/scraper.py

      # 把刷新后的数据提交回仓库(下次部署即可读到最新)。
      # 用默认 GITHUB_TOKEN 推送不会触发新的 workflow, 无死循环。
      - name: 提交刷新后的数据(若有变化)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json data/review.md js/data-inline.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动刷新会议数据 [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
