<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 顶会信息看板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI <span class="accent">顶会信息看板</span></h1>
      <div class="subtitle">NeurIPS · ICML · ICLR · AAAI · IJCAI · CVPR · ICCV · ECCV · NAACL · WSDM · WWW · ICRA - 关键时间节点与投稿倒计时</div>
      <div class="updated" id="updated">数据加载中…</div>
    </header>

    <h2 class="section-title">最近截止</h2>
    <section id="urgent"></section>

    <section id="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">状态</span>
        <div class="btn-group">
          <button class="btn-filter active" data-filter-status="all">全部</button>
          <button class="btn-filter" data-filter-status="open">投稿中</button>
          <button class="btn-filter" data-filter-status="closed">已截止</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">排序</span>
        <select id="sort-select">
          <option value="deadline">按截止日期</option>
          <option value="name">按会议名称</option>
        </select>
      </div>
    </section>

    <h2 class="section-title">全部会议</h2>
    <section id="board"></section>

    <footer>
      <p>数据来源: 各会议官网 + ccf-deadlines · 时区统一为 AoE (UTC-12) · 倒计时实时计算</p>
      <p>由 Python 抓取脚本生成 · 仅供参考，请以官网为准</p>
    </footer>
  </div>

  <!-- data-inline.js 由 scraper.py 生成，注入 window.CONF_DATA，保证 file:// 双击可用 -->
  <script src="js/data-inline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
